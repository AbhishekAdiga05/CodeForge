# Judge0 Configuration File
# https://github.com/judge0/judge0/blob/master/judge0.conf.default

################################################################################
# Judge0 Configuration
################################################################################

# Number of workers to run (leave empty for auto-detection = number of CPU cores)
RAILS_MAX_THREADS=4
RAILS_ENV=production
RAILS_SERVE_STATIC_FILES=true

# Security token for API authentication (change this in production!)
AUTHN_HEADER=X-Auth-Token
AUTHN_TOKEN=your-secret-auth-token-change-me

# Disable authentication for development (set to true for production)
DISABLE_AUTH=true

################################################################################
# Database Configuration (PostgreSQL)
################################################################################

POSTGRES_HOST=db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=YourSecurePassword123!

# Database URL for Rails
DATABASE_URL=postgresql://judge0:YourSecurePassword123!@db:5432/judge0

################################################################################
# Redis Configuration
################################################################################

REDIS_HOST=redis
REDIS_PORT=6379
REDIS_PASSWORD=YourRedisPassword123!

# Redis URL for Rails
REDIS_URL=redis://:YourRedisPassword123!@redis:6379

################################################################################
# Execution Limits (adjust based on your needs)
################################################################################

# Maximum CPU time limit (in seconds)
CPU_TIME_LIMIT=5.0
MAX_CPU_TIME_LIMIT=15.0

# Maximum CPU extra time (in seconds)
CPU_EXTRA_TIME=1.0
MAX_CPU_EXTRA_TIME=5.0

# Maximum wall time limit (in seconds)
WALL_TIME_LIMIT=10.0
MAX_WALL_TIME_LIMIT=20.0

# Maximum memory limit (in kilobytes)
MEMORY_LIMIT=128000
MAX_MEMORY_LIMIT=512000

# Maximum stack limit (in kilobytes)
STACK_LIMIT=64000
MAX_STACK_LIMIT=128000

# Maximum number of processes/threads
MAX_PROCESSES_AND_OR_THREADS=60
MAX_MAX_PROCESSES_AND_OR_THREADS=120

# Enable per-process and per-thread memory limit
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false

# Enable per-process and per-thread time limit
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false

# Maximum file size (in kilobytes)
MAX_FILE_SIZE=4096
MAX_MAX_FILE_SIZE=8192

# Number of runs
NUMBER_OF_RUNS=1
MAX_NUMBER_OF_RUNS=20

################################################################################
# Submission Configuration
################################################################################

# Maximum queue size
MAX_QUEUE_SIZE=100

# Enable wait (allows waiting for submission result)
ENABLE_WAIT_RESULT=true

# Enable batched submissions
ENABLE_BATCHED_SUBMISSIONS=true

# Maximum batched submissions
MAX_SUBMISSION_BATCH_SIZE=20

# Allow only submitted source code to be run
ALLOW_ONLY_SUBMITTED_SOURCE_CODE=true

################################################################################
# Network Configuration
################################################################################

# Enable network for submission
ENABLE_NETWORK=false

################################################################################
# Callbacks
################################################################################

# Enable callbacks
ENABLE_CALLBACKS=true

# Callbacks max tries
CALLBACKS_MAX_TRIES=3

# Callbacks timeout (in seconds)
CALLBACKS_TIMEOUT=5

################################################################################
# Maintenance Mode
################################################################################

MAINTENANCE_MODE=false
MAINTENANCE_MESSAGE=Judge0 is currently under maintenance. Please try again later.